name: Package Nodryl

on:
  workflow_dispatch:

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build native binary
        run: sh scripts/build-platform.sh
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nodryl-${{ matrix.platform }}
          path: npm/${{ matrix.platform }}/bin/nodryl
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: nodryl-*
          path: artifacts
      - name: Stage platform packages
        run: |
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            mkdir -p "npm/$platform/bin"
            cp "artifacts/nodryl-$platform/nodryl" "npm/$platform/bin/nodryl"
            chmod 755 "npm/$platform/bin/nodryl"
          done
      - name: Publish platform binaries
        run: |
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            npm publish "./npm/$platform" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish CLI and tracing helper
        run: npm publish . --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
